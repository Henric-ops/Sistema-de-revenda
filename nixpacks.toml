[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.bcmath", "php84Extensions.tokenizer", "php84Extensions.ctype"]

[phases.install]
cmds = [
  "curl -sS https://getcomposer.org/installer | php84",
  "php84 composer.phar install --no-dev --optimize-autoloader"
]

[start]
cmd = "php84 artisan migrate --force && php84 -S 0.0.0.0:$PORT -t public"
